name: Run Jest Tests

on:
  - push
  - workflow_dispatch
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # pin@v4

      - name: Install Dependencies
        run: npm install

      - name: Run Jest Tests
        run: npm test
